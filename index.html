<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TOP Agent — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOP Agent — прототип. Брэндийн өнгийг энд сольно.
   ============================================================ */
:root{
  --brand-primary:#0F4A5A;
  --brand-accent:#D97A1E;
  --ink:#10161C;
  --muted:#5E6B76;
  --line:#E2E7EA;
  --canvas:#F5F7F8;
  --ok:#157A52;
  --ok-bg:#E8F5EF;
  --warn:#A8600B;
  --warn-bg:#FDF3E3;
  --danger:#B3261E;
  --danger-bg:#FDECEA;
  --radius:12px;
  --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#E9ECEE;
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand-primary)}
:focus-visible{outline:3px solid var(--brand-accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Тайз: утас + Демо самбар ---------- */
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:28px 20px 60px}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{
  position:relative;width:390px;height:812px;background:#fff;border-radius:34px;
  border:10px solid #1B2227;box-shadow:0 18px 50px rgba(16,22,28,.28);overflow:hidden;
}
.frame-note{margin:0;font-size:13px;color:#7B868F}
.app{display:flex;flex-direction:column;height:100%;background:var(--canvas)}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain}
.demo-fab{display:none}

@media (max-width:1040px){
  .stage{padding:0;display:block}
  .phone{width:100%;max-width:520px;height:100vh;height:100dvh;border:0;border-radius:0;margin:0 auto;box-shadow:none}
  .frame-note{display:none}
  .demo-fab{
    display:block;position:fixed;right:14px;bottom:88px;z-index:60;background:#1B2227;color:#fff;
    border-radius:999px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.3);min-height:var(--tap)
  }
}

/* ---------- Ерөнхий бүтэц ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--canvas);
  padding:14px 18px 10px;border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.demo-tag{
  font-size:12px;color:#8A949C;border:1px dashed #C6CED3;border-radius:999px;
  padding:2px 8px;white-space:nowrap;flex:none
}
.body-pad{padding:16px 18px 28px}
.section-label{font-size:14px;color:var(--muted);font-weight:600;margin:22px 0 8px}
.section-label:first-child{margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.hr{height:1px;background:var(--line);border:0;margin:16px 0}
.center{text-align:center}
.nowrap{white-space:nowrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row-gap{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Мөрийн жагсаалт (картын оронд) ---------- */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 16px;min-height:var(--tap);border-bottom:1px solid var(--line);background:#fff;
}
.item:last-child{border-bottom:0}
button.item:hover{background:#FAFBFC}
.item-main{flex:1;min-width:0}
.item-title{font-weight:600}
.item-sub{font-size:14px;color:var(--muted);margin-top:2px}
.chev{color:#AAB3BA;font-size:20px;line-height:1;flex:none}

/* ---------- Гол үйлдлийн блок (нүүрний эхний мөр) ---------- */
.primary-block{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand-accent);
  border-radius:var(--radius);padding:16px
}
.primary-block h2{margin:0 0 2px;font-size:18px}

/* ---------- Товч ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:12px 18px;border-radius:10px;font-weight:600;font-size:16px;
  background:var(--brand-primary);color:#fff;border:1px solid var(--brand-primary);width:100%
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--brand-primary)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:#fff;border-color:#E3B7B3;color:var(--danger)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:15px;width:auto;border-radius:8px}
.btn.auto{width:auto}

/* ---------- Chip ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;
  min-height:var(--tap);font-size:16px;display:inline-flex;align-items:center
}
.chip[aria-pressed="true"]{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff}
.chip.sm{min-height:36px;padding:6px 12px;font-size:15px}

/* ---------- Badge ---------- */
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--danger-bg);color:var(--danger)}
.badge.neutral{background:#EEF1F3;color:var(--muted)}
.badge.accent{background:#FBEEDE;color:#8A4C08}

.notice{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:#6F4308}
.notice.err{background:var(--danger-bg);color:#8A1D17}
.notice.info{background:#EDF3F5;color:#22434D}
.notice.ok{background:var(--ok-bg);color:#0E5C3E}
textarea.input{resize:vertical;line-height:1.5;font-size:15px}

/* ---------- Form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input{
  width:100%;min-height:var(--tap);padding:11px 14px;border:1px solid #C9D1D6;border-radius:10px;
  background:#fff;font-size:16px
}
.input:focus{border-color:var(--brand-primary)}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.err-text{font-size:14px;color:var(--danger);margin-top:6px;font-weight:500}

/* ---------- Доод цэс ---------- */
.nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:none}
.nav button{
  flex:1;padding:8px 2px calc(8px + env(safe-area-inset-bottom));min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;color:var(--muted);font-weight:500
}
.nav button[aria-current="page"]{color:var(--brand-primary);font-weight:700}
.nav .ic{width:22px;height:22px;display:block}
.nav .dot{position:absolute;margin:-4px 0 0 12px;width:7px;height:7px;border-radius:50%;background:var(--brand-accent)}

/* ---------- Bottom sheet ---------- */
.sheet-backdrop{position:absolute;inset:0;background:rgba(16,22,28,.42);z-index:40;animation:fade .18s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;
  border-radius:18px 18px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .22s ease
}
.sheet-head{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:#D6DCE0;margin:0 auto 10px}
.sheet-body{padding:16px 18px;overflow-y:auto}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:16px;right:16px;bottom:78px;z-index:70;background:#1B2227;color:#fff;
  border-radius:10px;padding:13px 16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .18s ease
}
.toast.err{background:#8A1D17}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,#E8ECEE 25%,#F2F5F6 37%,#E8ECEE 63%);background-size:400% 100%;
  animation:sh 1.3s infinite;border-radius:8px;height:14px;margin-bottom:10px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---------- Цолны самбар (онцлох) ---------- */
.rank{
  background:linear-gradient(160deg,var(--brand-primary) 0%,#0A333F 100%);
  color:#fff;border-radius:16px;padding:20px 18px 22px;position:relative;overflow:hidden
}
.rank::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(217,122,30,.14)}
.rank-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.rank-now{font-size:14px;color:#A9C2C9;letter-spacing:.02em}
.rank-gap{font-size:24px;font-weight:700;line-height:1.25;margin:10px 0 18px;position:relative}
.bar{position:relative;margin-bottom:14px}
.bar-label{display:flex;justify-content:space-between;font-size:14px;color:#BCD1D7;margin-bottom:6px}
.bar-track{height:10px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--brand-accent);transition:width .4s ease}
.bar-fill.done{background:#39C08A}
.rank-note{font-size:14px;color:#A9C2C9;position:relative;margin:0}

/* ---------- Ирцийн тор ---------- */
.grid-att{display:grid;grid-template-columns:auto repeat(2,1fr);gap:6px;align-items:center}
.att-cell{border-radius:8px;padding:9px 6px;text-align:center;font-size:14px;font-weight:600}
.att-P{background:var(--ok-bg);color:var(--ok)}
.att-L{background:var(--warn-bg);color:var(--warn)}
.att-E{background:#EEF1F3;color:var(--muted)}
.att-A{background:var(--danger-bg);color:var(--danger)}
.att-N{background:#F4F6F7;color:#B6BEC4}

/* ---------- Юүлүүр ---------- */
.funnel{display:flex;gap:8px}
.fn{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.fn b{display:block;font-size:22px;line-height:1.1}
.fn span{font-size:13px;color:var(--muted)}

/* ---------- Тоон товчлуур ---------- */
.pin-dots{display:flex;gap:12px;justify-content:center;margin:22px 0 26px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #B9C3C9}
.pin-dot.on{background:var(--brand-primary);border-color:var(--brand-primary)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.key{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:58px;font-size:23px;font-weight:600}
.key.blank{background:transparent;border:0}
.key:active{background:#EFF3F4}

/* ---------- QR ---------- */
.qr-full{position:absolute;inset:0;z-index:80;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.qr-box{background:#fff;padding:12px;border:1px solid var(--line);border-radius:14px}
.qr-timer{height:6px;border-radius:999px;background:#E6EAEC;overflow:hidden;width:220px;margin:18px auto 8px}
.qr-timer i{display:block;height:100%;background:var(--brand-primary)}
.qr-count{font-size:44px;font-weight:700;line-height:1}

/* ---------- Демо самбар ---------- */
.demo{
  width:340px;flex:none;background:#151B20;color:#E8EDF0;border-radius:16px;padding:16px 16px 22px;
  font-size:14px;max-height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:28px
}
.demo h2{margin:0 0 2px;font-size:16px;color:#fff}
.demo .demo-sub{margin:0 0 14px;color:#8E9AA3;font-size:13px}
.demo-group{border-top:1px solid #2A3238;padding:12px 0 4px}
.demo-group>label{display:block;font-weight:600;color:#C7D0D6;margin-bottom:8px}
.demo-opts{display:flex;flex-wrap:wrap;gap:6px}
.demo-opt{
  border:1px solid #38424A;background:#1E262C;color:#C7D0D6;border-radius:8px;padding:8px 10px;
  font-size:13px;min-height:36px
}
.demo-opt[aria-pressed="true"]{background:#2F6C7E;border-color:#3C8CA3;color:#fff;font-weight:600}
.demo-btn{border:1px solid #38424A;background:#1E262C;color:#E8EDF0;border-radius:8px;padding:10px 12px;min-height:40px;width:100%;font-size:14px;font-weight:600}
.demo-btn:hover{background:#273138}
.demo-note{color:#7E8B94;font-size:12px;margin-top:8px;line-height:1.4}
.test-live{background:#0E2A33;border:1px solid #2F6C7E;border-radius:10px;padding:10px 12px;margin-top:10px}
.test-live b{color:#fff}
.demo-close{display:none}
@media (max-width:1040px){
  .demo{
    position:fixed;inset:auto 0 0 0;width:100%;max-height:78vh;border-radius:16px 16px 0 0;z-index:70;
    transform:translateY(102%);transition:transform .22s ease
  }
  .demo.open{transform:none}
  .demo-close{display:block;position:absolute;right:12px;top:12px;color:#8E9AA3;font-size:22px;min-height:var(--tap);min-width:var(--tap)}
}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Зам: листинг 10 + борлуулалт 9 ---------- */
.path{display:grid;grid-template-columns:10fr 9fr;gap:6px;margin-top:10px}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:6px;border-radius:2px;background:#D5DCE1}
.seg i.done{background:var(--ok)}
.seg i.cur{background:var(--brand-accent)}
.seg.big i{height:8px}
.path-now{font-size:13px;font-weight:600;margin-top:6px;color:#8A4C08}
.path-now.deal{color:var(--brand-primary)}
.path-now.closed{color:var(--ok)}
.track{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;overflow:hidden}
.track:first-child{margin-top:0}
.track-head{display:block;width:100%;text-align:left;padding:12px 16px;min-height:var(--tap);background:#fff;border:0;font:inherit;color:inherit;cursor:pointer}
.track-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.track-top .small{flex:1;min-width:0}
.track-top .chev{transition:transform .2s}
.track.open .track-top .chev{transform:rotate(180deg)}
.steps{list-style:none;margin:0;padding:4px 16px 10px;display:none;border-top:1px solid var(--line)}
.track.open .steps{display:block}
.step{position:relative;display:flex;gap:12px;padding:10px 0}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:38px;bottom:-10px;width:2px;background:#D5DCE1}
.step.done:not(:last-child)::before{background:var(--ok)}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff;border:2px solid #C9D2D8;color:var(--muted);position:relative;z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .dot{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff;box-shadow:0 0 0 4px #FBEEDE}
.step-main{flex:1;min-width:0;padding-top:3px}
.step-title{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step.todo .step-title{color:var(--muted);font-weight:500}
.step-who{font-size:12px;font-weight:500;color:var(--muted)}
.step-chk{font-size:13px;color:var(--muted);margin-top:4px}
.step-lock{font-size:14px;color:var(--warn);font-weight:600;margin-top:6px}
.step-wait{font-size:14px;color:var(--brand-primary);font-weight:600;margin-top:6px}
.step-doc{font-size:13px;color:var(--ok);margin-top:4px;overflow-wrap:anywhere}
.step .btn{margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:#D5DCE1}
.legend i.done{background:var(--ok)}
.legend i.cur{background:var(--brand-accent)}

/* ---------- Цахим гарын үсэг (листингийн 6-р алхам) ---------- */
.esign-st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sign-steps{display:flex;gap:6px;margin:0 0 16px}
.sign-steps span{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:8px;background:#EEF1F3}
.sign-steps span.on{background:var(--brand-primary);color:#fff}
.sign-steps span.done{background:var(--ok-bg);color:var(--ok)}
.sms-mock{background:#fff;border:1px dashed #C6CED3;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.sms-mock b{font-size:20px;letter-spacing:.18em}
.terms{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
.terms div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.terms div:last-child{border-bottom:0}
.terms dt{color:var(--muted);flex:none}
.terms dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.sig-pad{display:block;width:100%;height:190px;background:#fff;border:2px dashed #C6CED3;border-radius:12px;touch-action:none;cursor:crosshair}
.sig-img{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.audit{font-size:13px}
.audit div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.audit div:last-child{border-bottom:0}
.audit span:first-child{color:var(--muted);flex:none;width:118px}
.audit span:last-child{overflow-wrap:anywhere}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:14px 0;cursor:pointer}
.check-row input{width:20px;height:20px;margin-top:1px;flex:none}
/* ---------- Нийтийн демо тууз ---------- */
.demo-ribbon{height:24px;line-height:24px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--brand-accent);color:#fff}
@media (max-width:1040px){.phone{height:calc(100vh - 24px);height:calc(100dvh - 24px)}}
</style>
</head>
<body>
<div class="demo-ribbon" role="note">ДЕМО — бүх өгөгдөл хиймэл</div>
<div class="stage">
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="app">
        <div id="screen" class="screen" tabindex="-1"></div>
        <nav id="nav" class="nav" aria-label="Үндсэн цэс"></nav>
      </div>
      <div id="overlay"></div>
      <div id="toastRoot"></div>
    </div>
    <p class="frame-note">Прототип · бодит өгөгдөл ашиглаагүй</p>
  </div>
  <aside class="demo" id="demoPanel" aria-label="Демо самбар">
    <button class="demo-close" id="demoClose" aria-label="Хаах">✕</button>
    <h2>Демо самбар</h2>
    <p class="demo-sub">Аппын хэсэг биш. Үзүүлбэрийн тохиргоо.</p>
    <div id="demoBody"></div>
  </aside>
</div>
<button class="demo-fab" id="demoFab">Демо</button>

<script>
"use strict";
/* ==========================================================================
   ДАВХАРГА 1 — MOCK. Бодит хувилбарт энэ бүхэн Google Sheets дээр байна.
   ========================================================================== */
const TODAY = "2026.09.21";
const DEMO_CLOCK = {t:"08:57"};   // демо цаг — ирцийн төлөв үүгээр тодорхойлогдоно

const OFFICES = [
  {office_id:"119038", name:"Төв оффис"},
  {office_id:"OFFICE_2", name:"Оффис 2"},
  {office_id:"OFFICE_3", name:"Оффис 3"}
];

const SOURCES = [
  {code:"CALL",label:"Дуудлага",top:1},
  {code:"MARKETING",label:"Маркетинг",top:1},

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pd(s){const p=s.split(".").map(Number);return new Date(p[0],p[1]-1,p[2])}
function daysBetween(a,b){return Math.round((pd(a)-pd(b))/86400000)}

}

function objById(id){return S.data.objects.find(function(o){return o.id===id})}
function myObjects(agentId){return S.data.objects.filter(function(o){return o.agent_id===agentId})}
function chkFilled(o){return CHK.filter(function(c){const v=o.f[c.k];return v!==null&&v!==undefined&&v!==""}).length}
function chkReady(o){return chkFilled(o)===CHK.length && o.ph.length>=PHOTOS.length}
/* Гэрээний баримт: гарын үсэгтэй гэрээ үргэлж + хоёр асуултаас гарах жагсаалт */
function docsFor(o){
  return [SIGNED].concat(o.cp?(DOCS[o.cp]||[]):[], o.ps?(DOCS[o.ps]||[]):[]);
}
function docsDone(o){const need=docsFor(o);return need.filter(function(d){return o.docs.indexOf(d)>=0}).length}
function docsReady(o){return !!(o.cp&&o.ps) && docsDone(o)===docsFor(o).length}
function adReady(o){return !!o.ilist_code}
/* iConnect блок: баримт бүрэн + Admin Audit дууссан (8-р алхам) */
function ilistOk(o){return chkReady(o)&&docsReady(o)&&(o.stage>=9||o.deal>0)}
function chkPct(o){
  const a=chkFilled(o)/CHK.length, b=Math.min(1,o.ph.length/PHOTOS.length);
  const need=docsFor(o), d=(o.cp&&o.ps)?docsDone(o)/need.length:0;
  return Math.round((a*0.5+b*0.25+d*0.25)*100);
}
function lstageName(n){const s=LSTAGES[n-1];return s?s.n+". "+s.s:"—"}
function dstageName(n){const s=DSTAGES[n-1];return s?s.n+". "+s.s:"—"}
/* Зам: stage = листингийн одоогийн алхам (1–10), deal = борлуулалтын одоогийн алхам
   (0 эхлээгүй, 1–9, 10 = дууссан). Листинг Approve-оор дуусахад deal=1 болно. */
function stepState(o,trk,n){
  if(trk==="L"){ if(o.deal>0) return "done"; return n<o.stage?"done":(n===o.stage?"cur":"todo"); }
  if(!o.deal) return "todo";
  if(o.deal>DSTAGES.length) return "done";
  return n<o.deal?"done":(n===o.deal?"cur":"todo");
}
function curStep(o){
  if(!o.deal) return {trk:"L",n:o.stage,st:LSTAGES[o.stage-1]};
  if(o.deal<=DSTAGES.length) return {trk:"D",n:o.deal,st:DSTAGES[o.deal-1]};
  return null;
}
function isOfficeStep(st){return st.w==="ADM"||st.w==="FIN"}
function adsCount(o){return Object.keys(o.ads||{}).filter(function(k){return o.ads[k]==="тавигдсан"}).length}
/* Одоогийн алхмын шалгах цэг хангагдаагүй бол шалтгааныг буцаана, хангагдсан бол null */
function stepGate(o){
  const c=curStep(o); if(!c) return "Процесс дууссан";
  const st=c.st;
  if(st.doc && o.docs.indexOf(st.doc)<0) return st.doc+" хавсаргаагүй";
  if(c.trk==="L"){
    if(c.n===1 && !o.source) return "Эх сурвалж сонгоогүй";
    if(c.n===3 && !chkReady(o)) return "12 талбар + 8 зураг бүрэн биш";
    if(c.n===7 && !docsReady(o)) return (o.cp&&o.ps)?(docsFor(o).length-docsDone(o))+" баримт дутуу":"Баримтын 2 асуултад хариулаагүй";
    if(c.n===9 && !o.ilist_code) return "MLS код ороогүй";
  }else{
    if(c.n===1 && adsCount(o)<3) return "Зар "+adsCount(o)+"/3 сувагт тавигдсан";
  }
  return null;
}
function nextName(o){
  const c=curStep(o); if(!c) return "";
  if(c.trk==="L") return c.n<LSTAGES.length?lstageName(c.n+1):"Борлуулалт эхэлнэ";
  return c.n<DSTAGES.length?dstageName(c.n+1):"Хаагдана";
}

function stageName(o){
  if(o.deal>DSTAGES.length) return "Хаагдсан · шимтгэл олгосон";
  if(o.deal>0) return "Борлуулалт · "+dstageName(o.deal);
  return "Листинг · "+lstageName(o.stage);
}
function fmtSize(b){return b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function lsourceLabel(c){const s=LSOURCES.find(function(x){return x.code===c});return s?s.label:"—"}
function daysToExpiry(o){return o.expiry?daysBetween(o.expiry,TODAY):null}
function missingList(o){
  const m=CHK.filter(function(c){const v=o.f[c.k];return v===null||v===undefined||v===""}).map(function(c){return c.label});
  const needPh=PHOTOS.length-o.ph.length;
  if(needPh>0) m.push(needPh+" зураг");
  if(!o.cp||!o.ps) m.push("баримтын 2 асуулт");
  else docsFor(o).forEach(function(d){if(o.docs.indexOf(d)<0) m.push(d)});
  return m;
}
/* Жагсаалтын анхаарлын шалтгаан — нэг л мөр */
function attention(o){
  const ex=daysToExpiry(o);
  if(o.stage>=10 && ex!==null && ex<=30) return {k:"EXPIRY", t:"Гэрээ "+ex+" хоногт дуусна · сунгах акт"};
  if(o.deal>0 && o.days>=90 && o.leads===0) return {k:"STALE", t:o.days+" хоног · эзэнтэй баталгаажуулах"};
  if(!chkReady(o)) return {k:"CHK", t:missingList(o).filter(function(x){return x.indexOf("баримт")<0&&docsFor(o).indexOf(x)<0}).length+" зүйл дутуу"};
  if(o.stage<9 && !docsReady(o)) return {k:"DOCS", t:"Гэрээний баримт дутуу · iConnect цоожтой"};
  return null;
}
/* Үнийн сан — дүүрэг×өрөө байвал түүнийг, үгүй бол дүүргийн, эцэст нь нийт медиан */
function priceMedian(district,rooms){
  const dr=PRICE.dr[district+"|"+rooms];
  if(dr) return {med:dr.med,n:dr.n,lvl:"Дүүрэг + өрөөний тоо"};
  const d=PRICE.d[district];

function checkinState(ev){
  /* NOT_OPEN | OPEN | LATE | CLOSED  — демо цагаар */
  if(!ev) return "NONE";
  const d = daysBetween(ev.date,TODAY);
  if(d>0) return "NOT_OPEN_DAY";
  if(d<0) return "CLOSED";
  const now = mins(DEMO_CLOCK.t);
  if(now < mins(ev.open_from)) return "NOT_OPEN";

}

async function sha256Hex(s){
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
      return {alg:"SHA-256",hex:Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")};
    }
  }catch(e){}
  /* file:// зэрэг crypto.subtle-гүй орчинд — зөвхөн прототипийн нөөц */
  let h="";for(let i=0;i<8;i++)h+=hashStr(i+"|"+s).toString(16).padStart(8,"0");
  return {alg:"FNV (прототип)",hex:h};
}

function esignMake(o,ch){
  const ph=String(o.f.ophone||"").replace(/\D/g,"");
  if(ph.length!==8) return {ok:false,err:"Эзэмшигчийн утас (8 орон) бөглөөгүй"};
  if(o.docs.indexOf(SIGNED)>=0) return {ok:false,err:SIGNED+" аль хэдийн хавсаргасан"};
  const token=randToken(10,"abcdefghjkmnpqrstuvwxyz23456789"), at=stampNow();
  o.esign={status:"SENT",token:token,link:ESIGN_BASE+token,phone:ph,ch:ch||"SMS",sent_at:at,
    code:null,tries:0,verified_at:null,signed_at:null,hash:null,hash_alg:null,png:null,
    log:[[at,"Линк үүсгэж "+esignChLabel(ch||"SMS")+"-ээр "+maskPhone(ph)+" руу илгээсэн"]]};
  return {ok:true,esign:o.esign};
}

            SMS үйлчилгээгээр илгээнэ, 5 минут хүчинтэй. Кодыг хариунд БУЦААХГҮЙ. Прототип демо учир demoCode буцаана. */
  esignSendCode:(token,last4)=>call(function(){
    const o=esignByToken(token); if(!o) return {ok:false,err:"Линк хүчингүй"};
    const e=o.esign;
    if(e.status==="SIGNED") return {ok:false,err:"Гэрээнд аль хэдийн гарын үсэг зурсан"};
    if(e.tries>=ESIGN_MAX_TRIES) return {ok:false,err:"Оролдлого дууссан. Агенттайгаа холбогдоно уу."};
    if(String(last4)!==e.phone.slice(-4)){
      e.tries++; e.log.push([stampNow(),"Утасны сүүлийн 4 орон буруу ("+e.tries+"/"+ESIGN_MAX_TRIES+")"]);
      return {ok:false,err:"Гэрээнд бүртгэлтэй дугаартай таарахгүй байна. Үлдсэн оролдлого: "+(ESIGN_MAX_TRIES-e.tries)};
    }
    e.code=randToken(6,"0123456789");
    e.log.push([stampNow(),"Баталгаажуулах код "+maskPhone(e.phone)+" руу илгээсэн"]);
    return {ok:true,demoCode:e.code};
  },{write:true}),
  /* Бодит: google.script.run.esignVerify(token, code) */
  esignVerify:(token,code)=>call(function(){
    const o=esignByToken(token); if(!o) return {ok:false,err:"Линк хүчингүй"};
    const e=o.esign;
    if(e.tries>=ESIGN_MAX_TRIES) return {ok:false,err:"Оролдлого дууссан. Агенттайгаа холбогдоно уу."};
    if(!e.code||String(code)!==e.code){
      e.tries++; e.log.push([stampNow(),"Код буруу ("+e.tries+"/"+ESIGN_MAX_TRIES+")"]);
      return {ok:false,err:"Код буруу байна. Үлдсэн оролдлого: "+(ESIGN_MAX_TRIES-e.tries)};
    }
    e.verified_at=stampNow(); e.code=null;
    e.log.push([e.verified_at,"Код баталгаажсан"]);
    return {ok:true};
  },{write:true}),
  /* Бодит: google.script.run.esignSign(token, pngBase64) → Docs загвараас гэрээ үүсгэж гарын үсгийн зургийг
            оруулна → PDF → Drive/REMAX TOP/Объект/{код}/ хавтас; Utilities.computeDigest(SHA_256) → hash;
            баримтын мөрийг Sheets-д; PDF-ийг эзэмшигчид SMS линкээр, агентад апп-д. */
  esignSign:(token,png)=>call(async function(){
    const o=esignByToken(token); if(!o) return {ok:false,err:"Линк хүчингүй"};
    const e=o.esign;
    if(!e.verified_at) return {ok:false,err:"Утасны код баталгаажаагүй"};
    if(e.status==="SIGNED") return {ok:false,err:"Аль хэдийн зурсан"};
    e.signed_at=stampNow();
    const h=await sha256Hex(JSON.stringify(contractTerms(o))+"|"+e.phone+"|"+e.verified_at+"|"+e.signed_at+"|"+png);
    e.hash=h.hex; e.hash_alg=h.alg; e.png=png; e.status="SIGNED";
    e.log.push([e.signed_at,"Гарын үсэг зурсан · PDF үүсгэж «"+SIGNED+"»-д хавсаргасан"]);
    if(o.docs.indexOf(SIGNED)<0) o.docs.push(SIGNED);
    o.files=o.files||{};
    o.files[SIGNED]={name:"Гэрээ_"+o.id+"_цахим.pdf",size:Math.round(png.length*0.75)+48000,type:"application/pdf",at:TODAY,esign:true};
    return {ok:true,audit:e};
  },{write:true}),
  /* Одоогийн алхмыг дуусгах. who: AGENT (агент, худалдан авагчийн алхам) | OFFICE (админ, санхүү) */
  advance:(id,who)=>call(function(){
    const o=objById(id); if(!o) return {ok:false,err:"Объект олдсонгүй"};
    const c=curStep(o); if(!c) return {ok:false,err:"Процесс дууссан"};
    if((isOfficeStep(c.st)?"OFFICE":"AGENT")!==who) return {ok:false,err:WHO[c.st.w]+" хийх алхам"};
    const g=stepGate(o); if(g) return {ok:false,err:g};
    if(c.trk==="L"){ if(o.stage<LSTAGES.length) o.stage++; else o.deal=1; }
    else o.deal++;
    return {ok:true,label:stageName(o)};
  },{write:true}),
  officeQueue:()=>call(function(){
    return S.data.objects.map(function(o){return {o:o,c:curStep(o)}})
      .filter(function(x){return x.c&&isOfficeStep(x.c.st)})
      .map(function(x){
        const a=S.data.agents.find(function(g){return g.agent_id===x.o.agent_id});
        return {id:x.o.id,title:x.o.title,code:x.o.ilist_code||x.o.id,agent:a?a.full_name:"—",
                trk:x.c.trk,n:x.c.n,s:x.c.st.s,w:x.c.st.w,chk:x.c.st.c};
      });
  }),
  setField:(id,k,v)=>call(function(){
    const o=objById(id); if(o) o.f[k]=(v===""?null:v); return {ok:true};
  },{write:true}),
  togglePhoto:(id,slot)=>call(function(){
    const o=objById(id); const i=o.ph.indexOf(slot);
    if(i>=0) o.ph.splice(i,1); else o.ph.push(slot);
    return {ok:true,n:o.ph.length};
  },{write:true}),
  getPrice:(id)=>call(function(){
    const o=objById(id); const m=priceMedian(o.f.district,o.f.rooms);
    const u=(o.ask&&o.f.area)?o.ask/o.f.area/1e6:null;
    return {o:o,m:m,unit:u?Math.round(u*100)/100:null,comps:priceComps(o,5),meta:PRICE.meta};
  }),
  setIList:(id,code)=>call(function(){
    const o=objById(id); if(o){o.ilist_code=code; if(!o.deal&&o.stage===9)o.stage=10;} return {ok:true};
  },{write:true}),
  markAd:(id,ch)=>call(function(){
    const o=objById(id); if(o){o.ads[ch]="тавигдсан";} return {ok:true};
  },{write:true}),
  getAgents:()=>call(function(){return S.data.agents})
};

async function submitPin(){
  const f=S.flow;
  if(f.step==="LOGIN"){
    const r=await api.login(f.phone,f.pin);
    if(!r.ok){
      f.attempts++; f.pin="";
      if(f.attempts>=5){f.locked=true;f.err="5 удаа буруу оруулсан.";}

      renderLogin(); return;
    }
    S.session=r.agent.agent_id;
    if(r.must_change_pin){f.step="NEW_PIN";f.pin="";f.err="";renderLogin();}
    else finishLogin();
  } else if(f.step==="NEW_PIN"){
    f.newPin=f.pin; f.pin=""; f.step="NEW_PIN2"; renderLogin();
  } else if(f.step==="NEW_PIN2"){
    if(f.pin!==f.newPin){f.pin="";f.step="NEW_PIN";f.newPin="";f.err="PIN хоёр адил биш байна. Дахин оролдоно уу.";renderLogin();return;}
    try{
      await api.setPin(S.session,f.pin);
      markTest("T1");
      if(agentById(S.session).must_change_pin===false && f.fromProfile){toast("PIN солигдлоо");S.flow=null;go("#/me");return;}

    }catch(e){f.pin="";f.err="Хадгалж чадсангүй. Сүлжээгээ шалгаад дахин оролдоно уу.";renderLogin();}
  }
}

        "REMAX TOP: Гэрээ баталгаажуулах код <b>"+esc(f.demoCode)+"</b>. 5 минут хүчинтэй.</div>"+
        '<div class="field"><label for="cd">SMS код</label>'+
        '<input class="input" id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="'+esc(f.code)+'"></div>'+

      '<div class="notice info" style="margin-top:12px"><span>Талууд энэ гэрээг цахимаар — утасны код баталгаажуулж, дэлгэц дээр гарын үсэг зурах замаар — '+
      "байгуулахыг зөвшөөрнө. Гарын үсэгтэй PDF хоёр талд үлдэнэ.</span></div>"+

      '<button class="btn" id="signBtn" data-act="sign" disabled>Гарын үсэг зурж баталгаажуулах</button>'+

  } else {
    const e=r.audit;
    inner='<div class="center" style="padding:10px 0 16px"><div style="font-size:48px;line-height:1;color:var(--ok)">✓</div>'+

      el.disabled=true; el.textContent="Илгээж байна…";

      if(!res.ok){f.err=res.err; if(/Оролдлого дууссан/.test(res.err)) r.locked=true; else r.locked=false; renderSign(r); return;}
      f.err=""; f.demoCode=res.demoCode; f.step="CODE"; renderSign(r);

    resend:function(){f.step="PHONE";f.code="";f.demoCode=null;f.err="";renderSign(r)},
    verify:async function(el){
      const v=($("#cd").value||"").replace(/\D/g,""); f.code=v;
      el.disabled=true; el.textContent="Шалгаж байна…";

      if(!res.ok){f.err=res.err; if(/Оролдлого дууссан/.test(res.err)) r.locked=true; renderSign(r); return;}
      f.err=""; f.step="REVIEW"; renderSign(r);
    },
    toDraw:function(){if(f.agree){f.step="DRAW";f.err="";renderSign(r)}},
    toReview:function(){f.step="REVIEW";f.err="";renderSign(r)}

      r.status="SIGNED"; r.audit=res.audit; f.step="DONE"; renderSign(r); renderDemo();
    };
  }
}
/* Хуруугаар зурах талбар (Pointer Events — хулгана, мэдрэгч дэлгэц, стилус) */
function sigPad(cv,onChange){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="#10161C"; ctx.fillStyle="#10161C";
  let down=false, last=null, len=0;
  function pt(e){const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}}
  cv.addEventListener("pointerdown",function(e){
    e.preventDefault(); down=true; last=pt(e);
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,Math.PI*2); ctx.fill();
  });
  cv.addEventListener("pointermove",function(e){
    if(!down) return; e.preventDefault();
    const p=pt(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    len+=Math.hypot(p.x-last.x,p.y-last.y); last=p;
    onChange(len>=60);
  });
  ["pointerup","pointercancel"].forEach(function(t){cv.addEventListener(t,function(){down=false})});
  return {
    ok:function(){return len>=60},   // цэг, богино зураас гарын үсэгт тооцогдохгүй
    clear:function(){ctx.clearRect(0,0,w,h);len=0;onChange(false)},
    png:function(){
      /* цагаан дэвсгэртэй PNG — PDF-д шууд орно */
      const c=document.createElement("canvas"); c.width=cv.width; c.height=cv.height;
      const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(cv,0,0);
      return c.toDataURL("image/png");
    }
  };
}

  const rid=newRid(); renderNav("tx"); screenEl.innerHTML=topbar("Гүйлгээ")+skeleton(5);
  const txs=await api.getTransactions(S.session); if(rvStale(rid)) return;
  const pend=txs.filter(t=>!t.source_filled), done=txs.filter(t=>t.source_filled);
  function row(t,locked){
    return '<button class="item" data-act="open" data-id="'+esc(t.trr_id)+'">'+
      '<div class="item-main"><div class="item-title">'+esc(t.trr_id)+
      (t.manual?' <span class="badge warn">Тулгалт хүлээгдэж байна</span>':"")+"</div>"+
      '<div class="item-sub">'+esc(t.listing_address.split(" · ")[0])+" · "+
      (t.deal_type==="SALE"?"Худалдаа":"Түрээс")+" · "+esc(t.sold_date)+"</div>"+
      '<div class="item-sub">Шимтгэл '+fmtMNT(t.agent_commission)+
      (t.source_filled?" · "+esc(sourceLabel(t.source_code)):"")+"</div></div>"+
      (locked?'<span class="badge neutral">Цоожтой</span>':'<span class="chev">›</span>')+"</button>";
  }
  screenEl.innerHTML=topbar("Гүйлгээ")+'<div class="body-pad">'+
    '<div class="section-label">Эх сурвалж хүлээж буй ('+pend.length+")</div>"+
    (pend.length?'<div class="list">'+pend.map(t=>row(t,false)).join("")+"</div>"
      :'<div class="notice info">Бүх гүйлгээ бөглөгдсөн. Шинэ гүйлгээ хаагдахад энд гарч ирнэ.</div>')+
    '<div class="section-label">Бүртгэсэн ('+done.length+")</div>"+
    (done.length?'<div class="list">'+done.map(t=>row(t,!txEditable(t))).join("")+"</div>"
      :'<div class="notice info">Одоогоор бүртгэсэн гүйлгээ алга.</div>')+
    '<button class="btn ghost" style="margin-top:20px" data-act="manual">iList-д ороогүй гүйлгээ нэмэх</button>'+
    "</div>";
  ACTIONS={
    open:function(el){openTxSheet(el.getAttribute("data-id"))},
    manual:function(){
      openSheet("Гүйлгээ нэмэх",
        '<p class="small muted" style="margin:0 0 12px">iList дээр хараахан ороогүй гүйлгээг түр бүртгэнэ. Импорт хийгдэхэд тулгагдана.</p>'+
        '<div class="field"><label for="trr">TRR ID</label><input class="input" id="trr" placeholder="TRR-26-000000"></div>',
        '<button class="btn" data-act="saveManual">Нэмэх</button>',
        {saveManual:async function(el){
          const v=$("#trr").value.trim();
          if(!/^TRR-\d{2}-\d{6}$/.test(v)){toast("TRR ID-г TRR-26-000123 хэлбэрээр бичнэ үү","err");return;}
          el.disabled=true;el.textContent="Нэмж байна…";
          try{const r=await api.addManualTx(v);
            if(!r.ok){toast("Энэ TRR ID аль хэдийн бүртгэгдсэн байна","err");el.disabled=false;el.textContent="Нэмэх";return;}
            closeSheet();toast("Нэмэгдлээ");viewTx();}
          catch(e){el.disabled=false;el.textContent="Нэмэх";toast("Хадгалж чадсангүй. Сүлжээгээ шалгана уу.","err");}
        }});
    }
  };
}
function openTxSheet(trrId){
  const t=S.data.transactions.find(x=>x.trr_id===trrId);
  const locked=t.source_filled&&!txEditable(t);
  if(locked){
    openSheet(t.trr_id,
      '<p class="small muted" style="margin:0 0 10px">'+esc(t.listing_address)+"</p>"+
      '<div class="list">'+
      '<div class="item"><div class="item-main"><div class="item-sub">Дэд урсгал</div><div class="item-title">'+esc(subFlowLabel(t.sub_flow))+"</div></div></div>"+
      '<div class="item"><div class="item-main"><div class="item-sub">Эх сурвалж</div><div class="item-title">'+esc(sourceLabel(t.source_code))+"</div></div></div>"+
      (t.financing?'<div class="item"><div class="item-main"><div class="item-sub">Санхүүжилт</div><div class="item-title">'+esc(finLabel(t.financing))+(t.bank?" · "+esc(t.bank):"")+"</div></div></div>":"")+
      "</div>"+
      '<div class="notice warn" style="margin-top:14px">7 хоног өнгөрсөн тул засах боломжгүй. Засахыг менежерээс хүснэ үү.</div>',
      '<button class="btn secondary" data-act="sheetClose">Хаах</button>');
    return;
  }
  const f={sub_flow:t.sub_flow,source_code:t.source_code,financing:t.financing,bank:t.bank,note:t.note,all:false};
  function render(){
    const topSources=f.all?SOURCES:SOURCES.filter(s=>s.top||s.code===f.source_code);
    const needNote=(f.source_code==="OTHER"||f.sub_flow==="OTHER");
    const body=
      '<p class="small muted" style="margin:0 0 4px">'+esc(t.listing_address)+"</p>"+
      '<p class="small muted" style="margin:0 0 16px">'+(t.deal_type==="SALE"?"Худалдаа":"Түрээс")+" · "+esc(t.sold_date)+
      " · шимтгэл "+fmtMNT(t.agent_commission)+"</p>"+
      '<label class="small" style="font-weight:600;color:var(--muted)">Дэд урсгал</label>'+
      '<div class="chips" style="margin:8px 0 18px">'+SUB_FLOWS.map(s=>
        '<button class="chip sm" data-act="sub" data-v="'+s.code+'" aria-pressed="'+(f.sub_flow===s.code)+'">'+esc(s.label)+"</button>").join("")+"</div>"+
      '<label class="small" style="font-weight:600;color:var(--muted)">Эх сурвалж</label>'+
      '<div class="chips" style="margin:8px 0 8px">'+topSources.map(s=>
        '<button class="chip sm" data-act="src" data-v="'+s.code+'" aria-pressed="'+(f.source_code===s.code)+'">'+esc(s.label)+"</button>").join("")+"</div>"+
      ((f.all||SOURCES.every(function(s){return s.top}))?"":'<button class="btn ghost sm" data-act="allSrc" style="margin-bottom:16px">Бүгдийг харах</button>')+
      (t.deal_type==="SALE"?
        '<div style="margin-top:12px"><label class="small" style="font-weight:600;color:var(--muted)">Санхүүжилт</label>'+
        '<div class="chips" style="margin:8px 0 18px">'+FINANCING.map(s=>
          '<button class="chip sm" data-act="fin" data-v="'+s.code+'" aria-pressed="'+(f.financing===s.code)+'">'+esc(s.label)+"</button>").join("")+"</div></div>":"")+
      (t.deal_type==="SALE"&&f.financing==="BANK_LOAN"?
        '<label class="small" style="font-weight:600;color:var(--muted)">Банк</label>'+
        '<div class="chips" style="margin:8px 0 18px">'+BANKS.map(b=>
          '<button class="chip sm" data-act="bank" data-v="'+esc(b)+'" aria-pressed="'+(f.bank===b)+'">'+esc(b)+"</button>").join("")+"</div>":"")+
      (needNote?'<div class="field"><label for="note">Тайлбар (заавал)</label><input class="input" id="note" value="'+esc(f.note||"")+'" placeholder="Жишээ: хуучин хамт олноороо"></div>':"");
    openSheet(t.trr_id,body,'<button class="btn" data-act="save">Хадгалах</button>',{
      sub:function(el){f.sub_flow=el.getAttribute("data-v");render()},
      src:function(el){f.source_code=el.getAttribute("data-v");render()},
      fin:function(el){f.financing=el.getAttribute("data-v");if(f.financing!=="BANK_LOAN")f.bank=null;render()},
      bank:function(el){f.bank=el.getAttribute("data-v");render()},
      allSrc:function(){f.all=true;render()},
      save:async function(el){
        const noteEl=$("#note"); if(noteEl) f.note=noteEl.value.trim();
        if(!f.sub_flow||!f.source_code){toast("Дэд урсгал болон эх сурвалжийг сонгоно уу","err");return;}
        if((f.source_code==="OTHER"||f.sub_flow==="OTHER")&&!f.note){toast("«Бусад» сонгосон тул тайлбар бичнэ үү","err");return;}
        if(t.deal_type==="SALE"&&!f.financing){toast("Санхүүжилтийн хэлбэрийг сонгоно уу","err");return;}
        el.disabled=true;el.textContent="Хадгалж байна…";
        try{
          await api.saveTxSource(t.trr_id,{sub_flow:f.sub_flow,source_code:f.source_code,financing:f.financing,bank:f.bank,note:f.note});
          markTest("T3"); closeSheet(); toast("Хадгалагдлаа"); viewTx();
        }catch(e){
          el.disabled=false;el.textContent="Хадгалах";
          toast("Хадгалж чадсангүй. Сүлжээгээ шалгаад дахин оролдоно уу.","err");
        }
      }
    });
    if($("#note")) $("#note").addEventListener("input",function(){f.note=this.value});
  }
  render();
}

/* ---------- Лид ---------- */
const STAGE_ORDER=["NEW","CONTACTED","VIEW_SCHEDULED","VIEWED","NEGOTIATION","WON"];
function nextStage(s){const i=STAGE_ORDER.indexOf(s);return i>-1&&i<STAGE_ORDER.length-1?STAGE_ORDER[i+1]:null}
async function viewLeads(){
  const rid=newRid(); renderNav("lead"); screenEl.innerHTML=topbar("Лид")+skeleton(5);
  const leads=await api.getLeads(S.session); if(rvStale(rid)) return;
  const recent=leads.filter(l=>daysBetween(TODAY,l.created_on)<=30);
  const viewed=recent.filter(l=>STAGE_ORDER.indexOf(l.stage)>=3).length;
  const won=recent.filter(l=>l.stage==="WON").length;
  const groups=STAGES.map(function(st){
    const items=leads.filter(l=>l.stage===st.code);
    if(!items.length) return "";
    return '<div class="section-label">'+esc(st.label)+" ("+items.length+")</div><div class=\"list\">"+
      items.map(function(l){
        const nx=nextStage(l.stage);
        return '<div class="item"><div class="item-main"><div class="item-title">'+esc(l.label)+"</div>"+
          '<div class="item-sub">'+esc(sideLabel(l.side))+" · "+esc(sourceLabel(l.source_code))+" · "+esc(l.created_on)+"</div>"+
          (l.stage==="LOST"&&l.lost_reason?'<div class="item-sub">Шалтгаан: '+esc(l.lost_reason)+"</div>":"")+
          (l.stage==="WON"&&l.ref_id?'<div class="item-sub">'+esc(l.ref_id)+"</div>":"")+"</div>"+
          (nx?'<button class="btn sm secondary" data-act="move" data-id="'+esc(l.lead_id)+'">'+esc(stageLabel(nx))+"</button>":"")+
          (l.stage!=="WON"&&l.stage!=="LOST"?'<button class="btn sm ghost" data-act="lost" data-id="'+esc(l.lead_id)+'" aria-label="Алдсан">✕</button>':"")+
          "</div>";
      }).join("")+"</div>";
  }).join("");
  screenEl.innerHTML=topbar("Лид",'<span class="badge neutral">Туршилтын</span>')+'<div class="body-pad">'+
    '<div class="funnel">'+
      '<div class="fn"><b>'+recent.length+"</b><span>Лид</span></div>"+
      '<div class="fn"><b>'+viewed+"</b><span>Үзлэг · "+pctOf(viewed,recent.length)+"%</span></div>"+
      '<div class="fn"><b>'+won+"</b><span>Гэрээ · "+pctOf(won,recent.length)+"%</span></div>"+
    "</div><p class=\"small muted\" style=\"margin:8px 0 0\">Сүүлийн 30 хоног</p>"+
    '<button class="btn" style="margin-top:16px" data-act="add">+ Лид</button>'+
    (leads.length?groups:'<div class="notice info" style="margin-top:16px">Лид бүртгээгүй байна. «+ Лид» дарж эхлүүлнэ.</div>')+
    "</div>";
  ACTIONS={
    add:addLeadSheet,
    move:async function(el){
      const id=el.getAttribute("data-id");
      const l=S.data.leads.find(x=>x.lead_id===id), nx=nextStage(l.stage);
      if(nx==="WON"){
        let ref="";
        openSheet("Амжилттай боллоо",
          '<div class="field"><label for="ref">TRR ID эсвэл MLS ID</label><input class="input" id="ref" placeholder="TRR-26-000123"></div>',
          '<button class="btn" data-act="saveWon">Хадгалах</button>',
          {saveWon:async function(b){
            ref=$("#ref").value.trim();
            if(!ref){toast("ID-г бичнэ үү","err");return;}
            b.disabled=true;b.textContent="Хадгалж байна…";
            try{await api.moveLead(id,"WON",{ref_id:ref});closeSheet();toast("Хадгалагдлаа");viewLeads();}
            catch(e){b.disabled=false;b.textContent="Хадгалах";toast("Хадгалж чадсангүй. Сүлжээгээ шалгана уу.","err")}
          }});
        return;
      }
      try{await api.moveLead(id,nx); if(nx==="VIEW_SCHEDULED") markTest("T5",id); toast(stageLabel(nx)); viewLeads();}
      catch(e){toast("Хадгалж чадсангүй. Сүлжээгээ шалгана уу.","err")}
    },
    lost:function(el){
      const id=el.getAttribute("data-id"); let reason=null;
      openSheet("Алдсан шалтгаан",
        '<div class="chips" id="lrChips">'+LOST_REASONS.map(r=>'<button class="chip sm" data-act="pickLr" data-v="'+esc(r)+'" aria-pressed="false">'+esc(r)+"</button>").join("")+"</div>",
        '<button class="btn danger" data-act="saveLost">Алдсан болгох</button>',
        {pickLr:function(b){reason=b.getAttribute("data-v");
          $$("#lrChips .chip").forEach(c=>c.setAttribute("aria-pressed",c===b));},
         saveLost:async function(b){
           if(!reason){toast("Шалтгаанаа сонгоно уу","err");return;}
           b.disabled=true;b.textContent="Хадгалж байна…";
           try{await api.moveLead(id,"LOST",{lost_reason:reason});closeSheet();toast("Хадгалагдлаа");viewLeads();}
           catch(e){b.disabled=false;b.textContent="Алдсан болгох";toast("Хадгалж чадсангүй. Сүлжээгээ шалгана уу.","err")}
         }});
    }
  };
}
function addLeadSheet(){
  const f={step:1,side:null,source_code:null,label:"",all:false};
  function render(){
    let body='<p class="small muted" style="margin:0 0 14px">Алхам '+f.step+"/3</p>";
    let foot="";
    if(f.step===1){
      body+='<label class="small" style="font-weight:600;color:var(--muted)">Тал</label>'+
        '<div class="chips" style="margin:8px 0">'+SIDES.map(s=>
          '<button class="chip" data-act="side" data-v="'+s.code+'" aria-pressed="'+(f.side===s.code)+'">'+esc(s.label)+"</button>").join("")+"</div>";
    } else if(f.step===2){
      const list=f.all?SOURCES:SOURCES.filter(s=>s.top||s.code===f.source_code);
      body+='<label class="small" style="font-weight:600;color:var(--muted)">Эх сурвалж</label>'+
        '<div class="chips" style="margin:8px 0">'+list.map(s=>
          '<button class="chip sm" data-act="src" data-v="'+s.code+'" aria-pressed="'+(f.source_code===s.code)+'">'+esc(s.label)+"</button>").join("")+"</div>"+
        ((f.all||SOURCES.every(function(s){return s.top}))?"":'<button class="btn ghost sm" data-act="allSrc">Бүгдийг харах</button>');
    } else {
      body+='<div class="field"><label for="lb">Шошго</label>'+
        '<input class="input" id="lb" maxlength="40" value="'+esc(f.label)+'" placeholder="Жишээ: Зайсан 3 өрөө">'+
        '<p class="hint">Нэр, утас бүү бич. Харилцагчийн мэдээлэл iList-д хадгалагдана.</p>'+
        '<p class="err-text" id="lbErr" style="display:none"></p></div>';
      foot='<button class="btn" data-act="saveLead">Хадгалах</button>';
    }
    openSheet("Шинэ лид",body,foot,{
      side:function(el){f.side=el.getAttribute("data-v");f.step=2;render()},
      src:function(el){f.source_code=el.getAttribute("data-v");f.step=3;render()},
      allSrc:function(){f.all=true;render()},
      saveLead:async function(el){
        const v=$("#lb").value.trim();
        if(!v){toast("Шошго бичнэ үү","err");return;}
        if(/\d{8}/.test(v)){
          const e=$("#lbErr");e.style.display="block";e.textContent="Утасны дугаар бүү бич, iList-д хадгална уу.";return;}
        el.disabled=true;el.textContent="Хадгалж байна…";
        try{
          const r=await api.addLead({side:f.side,source_code:f.source_code,label:v});
          S.demo.test.leadId=r.lead.lead_id;
          closeSheet();toast("Хадгалагдлаа");viewLeads();
        }catch(e2){el.disabled=false;el.textContent="Хадгалах";toast("Хадгалж чадсангүй. Сүлжээгээ шалгана уу.","err")}
      }
    });
    const lb=$("#lb"); if(lb){lb.addEventListener("input",function(){f.label=this.value});lb.focus()}
  }
  render();
}

/* ---------- Удирдлага ---------- */
function qrSvg(token,px){
  const n=25, rnd=mulberry32(hashStr(token)), m=[];
  for(let i=0;i<n;i++){m.push(new Array(n).fill(0))}
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)m[i][j]=rnd()>0.52?1:0;
  function finder(r,c){
    for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){
      const y=r+i,x=c+j; if(y<0||x<0||y>=n||x>=n) continue;
      const edge=(i===0||i===6||j===0||j===6)&&i>=0&&i<=6&&j>=0&&j<=6;
      const core=i>=2&&i<=4&&j>=2&&j<=4;
      m[y][x]=(edge||core)?1:0;
    }
  }
  finder(0,0);finder(0,n-7);finder(n-7,0);
  const cell=px/n; let rects="";

  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+px+" "+px+'" role="img" aria-label="QR код (демо)"><rect width="'+px+'" height="'+px+'" fill="#fff"/><g fill="#10161C">'+rects+"</g></svg>";

/* ---------- Файл хавсаргах (прототип: зөвхөн энэ төхөөрөмжийн санах ойд) ---------- */
const FILE_URLS = {};
function pickFile(cb){
  document.querySelectorAll("input.tmp-file").forEach(function(n){n.remove()});
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*,application/pdf"; inp.className="tmp-file"; inp.style.display="none";
  inp.addEventListener("change",function(){const f=inp.files&&inp.files[0]; inp.remove(); if(f) cb(f);});
  document.body.appendChild(inp); inp.click();
}
function attachFlow(id,doc){
  pickFile(async function(f){
    if(f.size>15*1048576){toast("15 MB-аас их файл хавсаргах боломжгүй","err");return;}
    const k=id+"|"+doc;
    if(FILE_URLS[k]) URL.revokeObjectURL(FILE_URLS[k]);
    FILE_URLS[k]=URL.createObjectURL(f);
    try{ await api.attachDoc(id,doc,{name:f.name,size:f.size,type:f.type}); }
    catch(e){ toast("Хадгалж чадсангүй — дахин оролдоно уу","err"); return; }
    toast("Хавсаргалаа"); route();
  });
}

function trackHtml(o,trk,open){
  const L=trk==="L"?LSTAGES:DSTAGES, name=trk==="L"?"Листинг":"Борлуулалт";
  const done=L.filter(function(s){return stepState(o,trk,s.n)==="done"}).length;

  const status=done===L.length?"дууссан":((c&&c.trk===trk)?"одоо: "+c.st.s:(trk==="D"?"листинг батлагдсаны дараа":""));
  const steps=L.map(function(s){
    const st=stepState(o,trk,s.n), f=s.doc&&(o.files||{})[s.doc], has=s.doc&&o.docs.indexOf(s.doc)>=0;
    let extra="";
    if(st==="cur"){

/* ==========================================================================
   ДАВХАРГА 4 — router
   ========================================================================== */
function parseHash(){
  const raw=(location.hash||"#/login").replace(/^#/,"");
  const parts=raw.split("?"), path=parts[0]||"/login", q={};
  if(parts[1]) parts[1].split("&").forEach(function(p){
    const kv=p.split("="); q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||"");
  });
  return {path:path,q:q};
}
function route(){
  clearTimers(); closeSheet(); ACTIONS={};
  const r=parseHash(), path=r.path;
  const open=(path==="/login"||path.indexOf("/checkin")===0||path.indexOf("/sign/")===0);
  if(!S.session&&!open){go("#/login");return;}
  screenEl.scrollTop=0;
  if(path==="/login") return viewLogin();
  if(path==="/checkin") return viewCheckin(r.q);
  if(path.indexOf("/sign/")===0) return viewSign(path.slice(6));
  if(path==="/home") return viewHome();
  if(path==="/attendance") return viewAttendance();
  if(path==="/tx") return viewTx();
  if(path.indexOf("/tx/")===0){ viewTx().then(function(){openTxSheet(path.slice(4))}); return; }
  if(path==="/leads") return S.demo.leadsTab?viewLeads():go("#/home");
  if(path==="/objects") return viewObjects();
  if(path.indexOf("/obj/")===0){
    const rest=path.slice(5), seg=rest.split("/"), oid=seg[0];
    if(seg[1]==="price") return viewObjPrice(oid);
    if(seg[1]==="ilist") return viewObjIList(oid);
    if(seg[1]==="ad")    return viewObjAd(oid);
    return viewObject(oid);
  }
  if(path==="/me") return viewMe();
  if(path==="/admin") return isManager()?viewAdmin():go("#/home");
  if(path==="/admin/qr") return isManager()?viewAdminQr():go("#/home");
  go("#/home");
}
window.addEventListener("hashchange",route);

function markTest(key,leadId){
  const t=S.demo.test;
  if(!t.running||t.task!==key) return;
  if(key==="T5"&&t.leadId&&leadId!==t.leadId) return;
  t.running=false;
  t.result={sec:Math.max(1,Math.round((Date.now()-t.start)/1000)),taps:t.taps};
  renderDemo();
}
